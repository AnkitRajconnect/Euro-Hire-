name: Weekly France company discovery

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      seed_only:
        description: Skip the Common Crawl S3 refresh and use the public seed snapshot only
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: eurohire-france-database
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Discover public ATS boards with France jobs
        env:
          EUROHIRE_CONTACT: \${{ github.server_url }}/\${{ github.repository }}
        run: |
          EXTRA=""
          if [ "\${{ inputs.seed_only }}" = "true" ]; then EXTRA="--seed-only"; fi
          python discover_companies.py --db data/jobs.db --report data/discovery_report.json --max-crawls 2 $EXTRA

      - name: Commit discovered companies and ATS sources
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add data/jobs.db data/discovery_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Discover French employers and public boards $(date -u +%F)"
            git push
          else
            echo 'Company and board database is unchanged.'
          fi

      - name: Save discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurohire-weekly-discovery-report
          path: data/discovery_report.json
          if-no-files-found: ignore
          retention-days: 30
