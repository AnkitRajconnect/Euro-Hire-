name: Euro-Hire scheduled Europe ATS discovery

on:
  push:
    branches: [main]
    paths:
      - "ats_pipeline.py"
      - "commoncrawl_index.py"
      - "discover_companies.py"
      - "sync_jobs.py"
      - "requirements.txt"
      - "test_pipeline.py"
      - ".github/workflows/weekly_discovery.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eurohire-europe-discovery-v2
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test pipeline
        run: python -m pytest -q
      - name: Validate website JavaScript
        run: node --check site/app.js
      - name: Discover ATS boards and current European jobs
        env:
          EUROHIRE_CONTACT: https://github.com/${{ github.repository }}
        run: python discover_companies.py --max-boards 10000 --crawl-limit 3 --max-insee 2000
      - name: Commit database and exports
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add data/jobs.db data/active_jobs.json data/active_jobs.csv data/pipeline_report.json site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Discover European ATS boards and vacancies $(date -u +%F-%H%M)"
            for attempt in 1 2 3 4 5; do
              git fetch origin main:refs/remotes/origin/main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Could not publish generated data after five push attempts" >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Euro-Hire Europe
        id: deployment
        uses: actions/deploy-pages@v5
