name: Euro-Hire website deployment

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site_deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eurohire-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate website JavaScript
        run: node --check site/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
