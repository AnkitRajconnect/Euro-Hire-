name: Euro-Hire 10-minute Europe job sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eurohire-europe-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test pipeline
        run: python -m pytest -q
      - name: Refresh discovered European ATS boards
        env:
          EUROHIRE_CONTACT: https://github.com/${{ github.repository }}
        run: python sync_jobs.py --max-boards 500 --max-insee 200
      - name: Commit database and exports
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add data/jobs.db data/active_jobs.json data/active_jobs.csv data/pipeline_report.json site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh European job vacancies $(date -u +%F-%H%M)"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo "Could not publish generated data after five push attempts" >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Euro-Hire Europe
        id: deployment
        uses: actions/deploy-pages@v5
