name: Daily France job sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eurohire-france-database
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Sync France jobs from public ATS feeds
        env:
          EUROHIRE_CONTACT: \${{ github.server_url }}/\${{ github.repository }}
        run: |
          python sync_jobs.py --db data/jobs.db --output-dir data --report data/sync_report.json

      - name: Commit database and active job exports
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add data/jobs.db data/active_jobs.json data/active_jobs.csv data/sync_report.json site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync France jobs $(date -u +%F)"
            git push
          else
            echo 'Active job data is unchanged.'
          fi

      - name: Save daily sync report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurohire-daily-sync-report
          path: data/sync_report.json
          if-no-files-found: ignore
          retention-days: 30
