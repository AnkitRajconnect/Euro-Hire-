name: Euro-Hire public ATS crawler and website

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eurohire-live-jobs-v2
  cancel-in-progress: false

jobs:
  crawl-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run offline tests and validate site JavaScript
        run: |
          python -m pytest -q
          node --check site/app.js

      - name: Discover public ATS boards without an employer allowlist
        run: |
          python -m crawler.source_discovery --out site/data/boards.json --max-per-pattern 10000 --refresh-days 7

      - name: Read public job feeds across discovered boards
        run: |
          python -m crawler.crawl --boards site/data/boards.json --max-boards 5000 --review-out /tmp/eurohire-review-queue.json --out site/data --workers 8

      - name: Save generated board index and live jobs
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add site/data/boards.json site/data/jobs.json site/data/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public ATS boards and Europe jobs $(date -u +%F)"
            git push
          else
            echo 'Public board index and live jobs did not change.'
          fi

      - name: Keep held vacancies for owner review (not published)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurohire-review-queue
          path: /tmp/eurohire-review-queue.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: crawl-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Euro-Hire
        id: deployment
        uses: actions/deploy-pages@v5
