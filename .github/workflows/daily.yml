name: Euro-Hire daily job feed and website

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eurohire-live-jobs
  cancel-in-progress: false

jobs:
  crawl-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests and validate the site JavaScript
        run: |
          python -m pytest -q
          node --check site/app.js

      - name: Read public employer career boards
        run: >-
          python -m crawler.crawl
          --companies companies.yaml
          --review-out /tmp/eurohire-review-queue.json
          --out site/data
          --workers 6

      - name: Save live job data
        run: |
          git config user.name 'eurohire-bot'
          git config user.email 'eurohire-bot@users.noreply.github.com'
          git add site/data/jobs.json site/data/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Europe job feed $(date -u +%F)"
            git push
          else
            echo 'Live job data did not change.'
          fi

      - name: Keep held vacancies for owner review (not published)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eurohire-review-queue
          path: /tmp/eurohire-review-queue.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: crawl-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Euro-Hire
        id: deployment
        uses: actions/deploy-pages@v5
